repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.13"]
        files: '\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\.(ts|cts|mts)|jsonc?|css)$'

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  - repo: local
    hooks:
      - id: check-md-frontmatter
        name: check Markdown frontmatter
        language: system
        types: [markdown]
        entry: uv run --no-project --with pyyaml python scripts/check_md_frontmatter.py

      - id: kisou-doc-system-check
        name: kisou doc-system copies match their templates
        language: system
        pass_filenames: false
        files: ^(skills/kisou/templates/docs/|docs/AGENTS\.md$|docs/[^/]+/AGENTS\.md$)
        entry: node skills/kisou/scripts/doc-system-check.js check --docs docs --case snake_case

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  - repo: local
    hooks:
      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        entry: pwsh -NoProfile -File scripts/PSScriptAnalyzerRunner.ps1
        language: system
        files: \.(ps1|psm1|psd1)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: trailing-whitespace
        exclude: &generated-files |
          (?x)(
            (^|/)package-lock\.json$|
            (^|/)pnpm-lock\.yaml$|
            (^|/)bun\.lock$|
            (^|/)Pipfile\.lock$|
            (^|/)Chart\.lock$|
            (^|/)\.rubocop_todo\.yml$|
            (^|/)apm\.lock\.yaml$|
            (^|/)compile_commands\.json$|
            \.tsbuildinfo$|
            \.snap$|
            \.(js|css)\.map$
          )
      - id: end-of-file-fixer
        exclude: *generated-files
      - id: mixed-line-ending
        args: [--fix=auto]
        exclude: *generated-files
